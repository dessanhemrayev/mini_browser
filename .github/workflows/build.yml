name: Build mini_browser

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --name mini_browser main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini_browser-build
          path: dist/mini_browser*

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ github.run_number }}
          release_name: mini_browser-${{ github.run_number }}
          body: Release from workflow run ${{ github.run_id }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload binary to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/mini_browser
          asset_name: mini_browser
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (Windows)
        shell: powershell
        run: |
          pyinstaller --noconfirm --onefile --name mini_browser main.py

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: mini_browser-build-windows
          path: dist\mini_browser.exe

      - name: Create GitHub Release for Windows
        id: create_release_win
        uses: actions/create-release@v1
        with:
          tag_name: v${{ github.run_number }}-win
          release_name: mini_browser-${{ github.run_number }}-win
          body: Windows release from workflow run ${{ github.run_id }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows binary to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release_win.outputs.upload_url }}
          asset_path: dist\mini_browser.exe
          asset_name: mini_browser.exe
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
